<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARKUIR — Jugadorxs</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      .jugadorxs-band {
        flex-shrink: 0;
        background: var(--cream);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0.4rem 2rem 1rem;
        height: clamp(80px, 12vw, 160px);
      }
      .jugadorxs-band h1 {
        font-family: "BebasNeue", sans-serif;
        font-size: clamp(2.5rem, 9vw, 8rem);
        color: var(--pink);
        line-height: 1;
        text-transform: uppercase;
      }

      #jugadorxs-grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        padding: 2rem;
      }

      .card-wrap {
        aspect-ratio: 4/3;
        perspective: 1000px;
        cursor: pointer;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 14px;
      }

      .card-wrap:hover .card-inner,
      .card-wrap.flipped .card-inner {
        transform: rotateY(180deg);
      }

      .card-front,
      .card-back {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        overflow: hidden;
      }

      .card-front {
        background: var(--pink);
        border: 2.5px solid var(--pink);
      }
      .card-front img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-back {
        background: var(--cream);
        border: 2.5px solid var(--pink);
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 0.8rem 1rem;
        gap: 10px;
        overflow: hidden;
      }

      .card-alias {
        font-family: "Outreque", sans-serif;
        font-size: clamp(0.6rem, 1vw, 0.8rem);
        color: var(--pink);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.7;
        line-height: 1;
      }
      .card-name {
        font-family: "Outreque", sans-serif;
        font-size: clamp(1rem, 1.8vw, 1.5rem);
        color: var(--pink);
        line-height: 1.05;
        text-transform: uppercase;
      }
      .card-meta {
        font-family: "Outreque", sans-serif;
        font-size: clamp(0.58rem, 0.8vw, 0.7rem);
        color: var(--ink);
        opacity: 0.5;
        line-height: 1.3;
      }
      .card-liga {
        display: inline-block;
        font-family: "Outreque", sans-serif;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: var(--pink);
        color: white;
        border-radius: 999px;
        padding: 1px 7px;
        margin: 0.1rem 0;
        align-self: flex-start;
      }
      .card-desc {
        font-family: "Outreque", sans-serif;
        font-size: 14px;
        color: var(--ink);
        line-height: 1.55;
        flex: 1;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 5;
        -webkit-box-orient: vertical;
      }

      @media (max-width: 900px) {
        #jugadorxs-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 0.75rem;
          padding: 1.2rem;
        }
      }
      @media (max-width: 600px) {
        #jugadorxs-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 0.6rem;
          padding: 0.8rem;
        }
        .card-wrap:hover .card-inner {
          transform: none;
        }
        .card-wrap.flipped .card-inner {
          transform: rotateY(180deg);
        }
      }
    </style>
  </head>

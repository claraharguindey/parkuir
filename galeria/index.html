<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARKUIR — Galería</title>

    <!-- Open Graph / compartir -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://parkuir.com/equipacion" />
    <meta property="og:title" content="PARKUIR — Galería" />
    <meta
      property="og:description"
      content="Un deporte para no encajar, para habitar el espacio público desde el goce y la desobediencia. Se camina raro, nos travestimos, se practica la caída, no se suda nada y, sobre todo, se disfruta."
    />
    <meta property="og:image" content="https://parkuir.com/images/og.png" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://parkuir.com/equipacion" />
    <meta name="twitter:title" content="PARKUIR — Galería" />
    <meta
      name="twitter:description"
      content="Un deporte para no encajar, para habitar el espacio público desde el goce y la desobediencia. Se camina raro, nos travestimos, se practica la caída, no se suda nada y, sobre todo, se disfruta."
    />
    <meta name="twitter:image" content="https://parkuir.com/images/og.png" />

    <!-- Color del navegador -->
    <meta name="theme-color" content="#fd8aaa" />

    <link rel="stylesheet" href="./../style.css" />
    <link rel="stylesheet" href="./../css/layout.css" />
    <link rel="stylesheet" href="./../css/galeria.css" />
  </head>
  <body>
    <header>
      <a href="/">parkuir</a>
      <button id="menu-toggle" aria-label="Abrir menú">☰</button>
      <nav id="main-nav">
        <a href="/about/">qué es parkuir</a>
        <a href="/linea-del-tiempo/">línea del tiempo</a>
        <a href="/reglamento/">reglamento</a>
        <a href="/jugadorxs/">jugadorxs</a>
        <a href="/equipacion/">equipación</a>
        <a class="active" href="/galeria/">galería</a>
      </nav>
    </header>

    <div class="page-band"><h1>Galería</h1></div>

    <div class="page-grid">
      <div class="page-left" id="gal-nav"></div>
      <div class="page-center" id="gal-content"></div>
      <div class="page-right"></div>
    </div>

    <div id="lightbox" class="lightbox" style="display: none">
      <div class="lightbox-bg"></div>
      <img src="" alt="" />
    </div>

    <script>
      const BTN_COLORS = [
        "pink",
        "orange",
        "red",
        "cream",
        "pink",
        "orange",
        "red",
      ];

      async function init() {
        const res = await fetch("./gallery-data.json");
        const data = await res.json();

        const nav = document.getElementById("gal-nav");
        const content = document.getElementById("gal-content");

        data.forEach((sec, i) => {
          const btn = document.createElement("button");
          btn.className = `panel-btn ${BTN_COLORS[i] || "pink"}${i === 0 ? " active" : ""}`;
          btn.textContent = sec.titulo;
          btn.onclick = () => showSection(sec.id, btn);
          nav.appendChild(btn);

          const div = document.createElement("div");
          div.className = `gal-section${i === 0 ? " active" : ""}`;
          div.id = "sec-" + sec.id;

          (sec.subsecciones || []).forEach((sub) => {
            const block = document.createElement("div");
            block.className = "gal-block";

            const h2 = document.createElement("h2");
            h2.textContent = sub.titulo;
            block.appendChild(h2);

            sub.texto.split("\n\n").forEach((para) => {
              if (!para.trim()) return;
              const p = document.createElement("p");
              p.textContent = para.trim();
              block.appendChild(p);
            });

            if (sub.imagenes && sub.imagenes.length > 0) {
              const grid = document.createElement("div");
              grid.className = "gal-grid";
              sub.imagenes.forEach((src) => {
                const img = document.createElement("img");
                img.dataset.src = src;
                img.alt = sub.titulo;
                img.addEventListener("click", () => openLightbox(src));
                grid.appendChild(img);
              });
              block.appendChild(grid);
            }

            div.appendChild(block);
          });

          content.appendChild(div);
        });

        const firstSec = document.querySelector(".gal-section.active");
        if (firstSec) {
          firstSec.querySelectorAll("img[data-src]").forEach((img) => {
            img.src = img.dataset.src;
            img.removeAttribute("data-src");
          });
        }

        document
          .getElementById("lightbox")
          .addEventListener("click", closeLightbox);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeLightbox();
        });
      }

      function showSection(id, btn) {
        document
          .querySelectorAll(".gal-section")
          .forEach((s) => s.classList.remove("active"));
        const sec = document.getElementById("sec-" + id);
        sec.classList.add("active");
        sec.querySelectorAll("img[data-src]").forEach((img) => {
          img.src = img.dataset.src;
          img.removeAttribute("data-src");
        });
        document
          .querySelectorAll(".panel-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("gal-content").scrollTop = 0;
      }

      function openLightbox(src) {
        const lb = document.getElementById("lightbox");
        lb.querySelector("img").src = src;
        lb.style.display = "flex";
      }
      function closeLightbox() {
        document.getElementById("lightbox").style.display = "none";
      }

      init();
    </script>
    <script src="./../js/menu.js"></script>
  </body>
</html>

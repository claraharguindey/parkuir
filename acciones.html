      let catActual = "todos";
      let vistos = [];

      function accionesFiltradas() {
        if (catActual === "todos") return ACCIONES;
        return ACCIONES.filter((a) => a.cat === catActual);
      }

      function siguiente() {
        const pool = accionesFiltradas();
        if (vistos.length >= pool.length) vistos = [];
        const disponibles = pool.filter((a) => !vistos.includes(a.n));
        const accion =
          disponibles[Math.floor(Math.random() * disponibles.length)];
        vistos.push(accion.n);
        mostrar(accion);
        actualizarContador(pool.length);
      }

      function mostrar(a) {
        const card = document.getElementById("accion-card");
        card.style.animation = "none";
        card.offsetHeight;
        card.style.animation = "";

        const bg = CAT_COLORS[a.cat] || "#ffd9ba";
        card.style.background = bg;

        const lightBg = a.cat === "grupo";
        const textColor = lightBg ? "#fd5e96" : "#fff";
        card.style.color = textColor;
        card
          .querySelectorAll(
            ".accion-num, .accion-titulo, .accion-desc, .accion-material, .accion-cat-badge",
          )
          .forEach((el) => {
            el.style.color = textColor;
          });

        document.getElementById("accion-num").textContent = String(
          a.n,
        ).padStart(2, "0");
        document.getElementById("accion-titulo").textContent = a.titulo;
        document.getElementById("accion-desc").textContent = a.desc;

        const badge = document.getElementById("accion-badge");
        badge.textContent = CAT_LABELS[a.cat];
        badge.dataset.cat = a.cat;

        const mat = document.getElementById("accion-material");
        mat.textContent = a.material || "";
        mat.style.display = a.material ? "block" : "none";
      }

      function actualizarContador(total) {
        document.getElementById("contador").textContent =
          `${vistos.length} de ${total} acciones`;
      }

      // Filtros — usan data-cat igual que antes
      document.querySelectorAll("#filtros .panel-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll("#filtros .panel-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          catActual = btn.dataset.cat;
          vistos = [];
          siguiente();
        });
      });

      document.getElementById("btn-tirar").addEventListener("click", siguiente);

      siguiente();
    </script>

    <script src="js/menu.js"></script>

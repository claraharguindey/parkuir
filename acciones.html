    <style>
      body {
        height: auto;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      .archivo-band {
        flex-shrink: 0;
        background: var(--cream);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0.4rem 2rem 1rem;
        height: clamp(80px, 12vw, 160px);
      }
      .archivo-band h1 {
        font-family: "BebasNeue", sans-serif;
        font-size: clamp(2.5rem, 9vw, 8rem);
        color: var(--pink);
        line-height: 1;
        text-transform: uppercase;
      }

      /* ── JUEGO ── */
      #juego {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem 4rem;
        gap: 2rem;
        min-height: 70vh;
        position: relative;
        z-index: 1;
      }

      /* filtros de categoría */
      #filtros {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        max-width: 700px;
      }

      .filtro-btn {
        font-family: "Outreque", sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border: 2px solid currentColor;
        border-radius: 24px;
        padding: 0.35rem 1rem;
        cursor: pointer;
        background: transparent;
        transition:
          background 0.15s,
          color 0.15s,
          transform 0.1s;
      }
      .filtro-btn:hover {
        transform: scale(1.04);
      }
      .filtro-btn.active {
        color: white;
      }

      .filtro-btn[data-cat="todos"] {
        color: var(--ink);
        border-color: var(--ink);
      }
      .filtro-btn[data-cat="basicos"] {
        color: #fd5e96;
        border-color: #fd5e96;
      }
      .filtro-btn[data-cat="arquitectura"] {
        color: #fd7145;
        border-color: #fd7145;
      }
      .filtro-btn[data-cat="material"] {
        color: #ff3773;
        border-color: #ff3773;
      }
      .filtro-btn[data-cat="grupo"] {
        color: #dd44ff;
        border-color: #dd44ff;
      }

      .filtro-btn[data-cat="todos"].active {
        background: var(--ink);
      }
      .filtro-btn[data-cat="basicos"].active {
        background: #fd5e96;
      }
      .filtro-btn[data-cat="arquitectura"].active {
        background: #fd7145;
      }
      .filtro-btn[data-cat="material"].active {
        background: #ff3773;
      }
      .filtro-btn[data-cat="grupo"].active {
        background: #dd44ff;
      }

      /* tarjeta */
      #card-area {
        width: 100%;
        max-width: 560px;
        position: relative;
      }

      .accion-card {
        background: var(--cream);
        border-radius: 24px;
        padding: 2.5rem 2.5rem 2rem;
        position: relative;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
        min-height: 260px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        animation: cardIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: scale(0.92) rotate(-2deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      .accion-num {
        font-family: "BebasNeue", sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.35;
        color: var(--ink);
      }

      .accion-cat-badge {
        display: inline-block;
        font-family: "Outreque", sans-serif;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: white;
        border-radius: 999px;
        padding: 2px 10px;
        align-self: flex-start;
      }

      .accion-titulo {
        font-family: "BebasNeue", sans-serif;
        font-size: clamp(2rem, 6vw, 3.5rem);
        color: var(--pink);
        line-height: 1;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .accion-desc {
        font-family: "Outreque", sans-serif;
        font-size: 0.9rem;
        line-height: 1.75;
        color: var(--ink);
        flex: 1;
      }

      .accion-material {
        font-family: "Outreque", sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        color: #ff3773;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.8;
      }

      /* botón tirar */
      #btn-tirar {
        font-family: "Outreque", sans-serif;
        font-size: 1.2rem;
        font-weight: 700;
        color: white;
        background: var(--pink);
        border: none;
        border-radius: 24px;
        padding: 0.9rem 3rem;
        cursor: pointer;
        transition:
          transform 0.15s,
          background 0.15s;
        letter-spacing: 0.04em;
      }
      #btn-tirar:hover {
        transform: scale(1.04);
        background: #fd5e96;
      }
      #btn-tirar:active {
        transform: scale(0.97);
      }

      /* contador */
      #contador {
        font-family: "Outreque", sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink);
        opacity: 0.3;
      }

      @media (max-width: 600px) {
        .accion-card {
          padding: 1.8rem 1.5rem 1.5rem;
          min-height: 200px;
        }
        #btn-tirar {
          width: 100%;
        }
      }
    </style>

      let catActual = "todos";
      let vistos = [];

      function accionesFiltradas() {
        if (catActual === "todos") return ACCIONES;
        return ACCIONES.filter((a) => a.cat === catActual);
      }

      function siguiente() {
        const pool = accionesFiltradas();
        if (vistos.length >= pool.length) vistos = [];
        const disponibles = pool.filter((a) => !vistos.includes(a.n));
        const accion =
          disponibles[Math.floor(Math.random() * disponibles.length)];
        vistos.push(accion.n);
        mostrar(accion);
        actualizarContador(pool.length);
      }

      function mostrar(a) {
        const card = document.getElementById("accion-card");
        // reanimar
        card.style.animation = "none";
        card.offsetHeight;
        card.style.animation = "";

        document.getElementById("accion-num").textContent =
          `#${String(a.n).padStart(2, "0")}`;
        document.getElementById("accion-titulo").textContent = a.titulo;
        document.getElementById("accion-desc").textContent = a.desc;

        const badge = document.getElementById("accion-badge");
        badge.textContent = CAT_LABELS[a.cat];
        badge.style.background = CAT_COLORS[a.cat];

        const mat = document.getElementById("accion-material");
        mat.textContent = a.material || "";
        mat.style.display = a.material ? "block" : "none";
      }

      function actualizarContador(total) {
        document.getElementById("contador").textContent =
          `${vistos.length} de ${total} acciones`;
      }

      // filtros
      document.querySelectorAll(".filtro-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filtro-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          catActual = btn.dataset.cat;
          vistos = [];
          siguiente();
        });
      });

      document.getElementById("btn-tirar").addEventListener("click", siguiente);

      // inicio
      siguiente();
    </script>

    <script src="js/menu.js"></script>
  </body>
</html>

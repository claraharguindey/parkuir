<!doctype html>
<html lang="es" class="interior">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PARKUIR — Equipación</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/equipacion.css" />
  </head>
  <body>
    <header>
      <a href="/">parkuir</a>
      <button id="menu-toggle" aria-label="Abrir menú">☰</button>
      <nav id="main-nav">
        <a href="/about.html">qué es parkuir</a>
        <a href="/cronograma.html">línea del tiempo</a>
        <a href="/reglamento.html">reglamento</a>
        <a href="/jugadorxs.html">jugadorxs</a>
        <a class="active" href="/equipacion.html">equipación</a>
        <a href="/acciones.html">acciones</a>
      </nav>
    </header>

    <div class="equip-band"><h1>Equipación</h1></div>

    <div class="equip-main">
      <!-- IZQUIERDA -->
      <div class="left-panel">
        <!-- SIDEBAR: barra de tamaño vertical + pinceles -->
        <div class="tools-sidebar">
          <!-- Barra de tamaño vertical -->
          <div class="size-vertical">
            <input
              type="range"
              id="brushSizeSlider"
              class="size-slider-v"
              min="2"
              max="40"
              step="1"
              value="5"
              orient="vertical"
              aria-label="Tamaño del pincel"
            />
          </div>

          <!-- Pinceles -->
          <div class="tools-col">
            <div class="tools-label">Pinceles</div>
            <button class="tool-btn" data-shape="stamp" title="Logo Parkuir">
              <span class="tool-icon stamp-icon">
                <img src="./images/logo_parkuir.png" alt="logo" />
              </span>
            </button>
            <button
              class="tool-btn active"
              data-shape="round"
              title="Pincel redondo"
            >
              <span class="tool-icon">●</span>
            </button>
            <button class="tool-btn" data-shape="square" title="Cuadrado">
              <span class="tool-icon">■</span>
            </button>
            <button
              class="tool-btn"
              data-shape="triangle-down"
              title="Triángulo invertido"
            >
              <span class="tool-icon">▼</span>
            </button>
            <button class="tool-btn" data-shape="diamond" title="Rombo">
              <span class="tool-icon">◆</span>
            </button>
            <button class="tool-btn" data-shape="heart" title="Corazón">
              <span class="tool-icon">♥</span>
            </button>
            <button class="tool-btn" data-shape="star" title="Estrella">
              <span class="tool-icon">✷</span>
            </button>
          </div>
        </div>

        <div class="shirt-area">
          <div class="shirt-container">
            <img
              class="shirt-bg"
              src="./images/camiseta.png"
              alt="camiseta fondo"
            />
            <canvas id="paintCanvas"></canvas>
            <img
              class="shirt-overlay"
              src="./images/camiseta2.png"
              alt="camiseta bordes"
            />
          </div>

          <div class="palette-area">
            <div class="colors-block">
              <div class="palette-rows">
                <div class="palette-row" id="paletteRow1"></div>
                <div class="palette-row" id="paletteRow2"></div>
              </div>
              <div class="action-col">
                <button class="btn-action" id="btnEraser">Borrar</button>
                <button class="btn-action" id="btnClear">Limpiar</button>
                <button class="btn-action" id="btnSave">Guardar</button>
              </div>
            </div>
            <div class="tools-label">Colores</div>
          </div>
        </div>
      </div>

      <!-- DERECHA -->
      <div class="right-panel">
        <div class="field-nombre">
          <input
            type="text"
            id="shirtTitle"
            placeholder="NOMBRE"
            maxlength="60"
          />
        </div>
        <div class="field-desc">
          <div class="field-desc-label">Descripción</div>
          <textarea
            id="shirtDesc"
            placeholder="Cuéntanos algo sobre tu equipo..."
          ></textarea>
        </div>
        <div class="submit-row">
          <button class="btn-x" id="btnX">✕</button>
          <button class="btn-submit" id="btnSubmit">añadir a la liga</button>
        </div>
      </div>
    </div>

    <div class="equip-band"><h1>Liga Parkuir</h1></div>

    <div class="gallery-section">
      <div class="gallery-grid" id="galleryGrid">
        <div class="gallery-empty" id="galleryEmpty">
          Todavía no hay diseños.
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="modal">
      <div class="modal-box">
        <button class="modal-close" id="modalClose">×</button>
        <img class="modal-img" id="modalImg" src="" alt="" />
        <div class="modal-num" id="modalNum"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <button
          class="btn-action"
          id="modalId"
          style="
            margin-top: 1rem;
            background: rgba(255, 55, 115, 0.15);
            color: var(--pink);
            border-color: var(--pink);
            display: none;
          "
        >
          Eliminar
        </button>
      </div>
    </div>

    <img
      id="stampImg"
      src="./images/logo_parkuir.png"
      style="display: none"
      alt=""
    />

    <script src="js/equipacion.js"></script>
    <script src="js/menu.js"></script>
  </body>
</html>

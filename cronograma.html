<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>PARKUIR — Línea del tiempo</title>
<link rel="stylesheet" href="style.css">
<style>

body {
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── BANDA CREMA CON TÍTULO ── */
.crono-band {
  flex-shrink: 0;
  background: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  height: clamp(70px, 10vw, 140px);
}
.crono-band h1 {
  font-family: "BebasNeue", sans-serif;
  font-size: clamp(2.5rem, 8vw, 7rem);
  color: var(--pink);
  line-height: 1;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

/* ── MUNDO ── */
#world-wrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#world {
  position: absolute;
  width: 6000px;
  height: 100%;
  top: 0; left: 0;
}

/* edificios rellenos fucsia */
.block {
  position: absolute;
  background: var(--pink);
  border: none;
}

/* año encima del edificio */
.bld-year {
  position: absolute;
  font-family: "BebasNeue", sans-serif;
  font-size: 1.3rem;
  color: white;
  pointer-events: none;
  white-space: nowrap;
  padding: 2px 6px;
}

/* el año del edificio activo se agranda */
.bld-year.active {
  font-size: 2rem;
}

.bld-text { display: none; }

/* ── PERSONAJE ── */
#player {
  position: absolute;
  width: 90px;
  pointer-events: none;
}
#player img {
  width: 100%;
  height: auto;
  display: block;
}

@keyframes squish {
  0%   { transform: scaleX(1.4) scaleY(0.7); }
  55%  { transform: scaleX(0.9) scaleY(1.1); }
  100% { transform: scaleX(1) scaleY(1); }
}
#player.squish { animation: squish 0.2s ease-out forwards; }

.particle {
  position: absolute; width: 4px; height: 4px;
  background: var(--pink); pointer-events: none;
  border-radius: 50%;
  animation: pf 0.5s ease-out forwards;
}
@keyframes pf { to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }

/* línea de suelo */
#ground-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: rgba(255,55,115,0.2);
}

/* ── CARD INFO FLOTANTE ── */
#info-card {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  width: clamp(260px, 30vw, 360px);
  background: var(--cream);
  border-radius: 16px;
  overflow: hidden;
  z-index: 100;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#info-card.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}

#info-card-close {
  position: absolute;
  top: 10px; right: 10px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(0,0,0,0.15);
  border: none;
  cursor: pointer;
  font-size: 0.7rem;
  color: white;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
  z-index: 2;
}
#info-card-close:hover { background: rgba(0,0,0,0.3); }

#info-card-img {
  width: 100%;
  height: 160px;
  background: var(--pink);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
#info-card-img-el {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

#info-card-body {
  padding: 1rem 1.2rem 1.4rem;
}
#info-card-year {
  font-family: "BebasNeue", sans-serif;
  font-size: 1rem;
  color: var(--pink);
  letter-spacing: 0.1em;
  margin-bottom: 0.3rem;
}
#info-card-title {
  font-size: 1rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  color: var(--ink);
  line-height: 1.2;
  margin-bottom: 0.6rem;
}
#info-card-text {
  font-size: 0.82rem;
  line-height: 1.65;
  color: var(--ink);
  opacity: 0.75;
}

/* ── CONTROLES ── */
#site-footer {
  position: fixed;
  bottom: 1.5rem;
  left: 2rem;
  z-index: 50;
  display: flex;
  gap: 0.5rem;
  background: var(--cream);
  border-radius: 999px;
  padding: 0.45rem 1rem;
  align-items: center;
  box-shadow: 0 2px 16px rgba(0,0,0,0.12);
}
#site-footer button {
  background: none;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--ink);
  padding: 2px 6px;
  line-height: 1;
  font-family: inherit;
  font-weight: 700;
}
#site-footer button:hover { color: var(--pink); }

#footer-hint {
  position: fixed;
  bottom: 1.9rem;
  right: 2rem;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--cream);
  opacity: 0.7;
  z-index: 50;
}
</style>
</head>

<script>
// ── LAYOUT ────────────────────────────────────────────────
let PLATFORMS = [];

function groundY() {
  return document.getElementById('world-wrapper').clientHeight - 50;
}

function layoutWorld() {
  const gY = groundY();
  document.getElementById('ground-line').style.top = gY + 'px';
  PLATFORMS = [];

  document.querySelectorAll('.bld').forEach(bld => {
    const left = parseInt(bld.dataset.left);
    const w    = parseInt(bld.dataset.w);
    const h    = parseInt(bld.dataset.h);
    const wb   = parseInt(bld.dataset.wb || 0);

    const block = bld.querySelector('.block');
    block.style.left   = left + 'px';
    block.style.top    = (gY - wb - h) + 'px';
    block.style.width  = w + 'px';
    block.style.height = h + 'px';

    const yearEl = bld.querySelector('.bld-year');
    yearEl.style.left = left + 'px';
    yearEl.style.top  = (gY - wb - h - 32) + 'px';
    yearEl.textContent = bld.dataset.year;

    PLATFORMS.push({ left, w, h, wb, el: bld });
  });
}

// ── GAME STATE ────────────────────────────────────────────
let playerX = 80, playerY = 0, velX = 0, velY = 0;
let onGround = true, worldOffset = 0;
let stepPhase = 0, jumpConsumed = false;
let activeCard = null;

const WORLD_W = 5700, GRAVITY = 0.55, JUMP_F = -13;
const ACCEL = 0.55, FRICTION = 0.80, MAX_SPD = 7, PLAYER_H = 95;
const PROX = 120;
const keys = { left: false, right: false };

function getFloor(x) {
  let h = 0;
  PLATFORMS.forEach(p => {
    if (x + 10 > p.left && x - 10 < p.left + p.w)
      h = Math.max(h, p.wb + p.h);
  });
  return h;
}

function tryJump() {
  if (onGround && !jumpConsumed) {
    velY = JUMP_F; onGround = false; jumpConsumed = true; spawnParticles();
  }
}

function spawnParticles() {
  const world = document.getElementById('world');
  const gY = groundY();
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const a = Math.PI + Math.random() * Math.PI, d = 15 + Math.random() * 30;
    p.style.setProperty('--dx', Math.cos(a) * d + 'px');
    p.style.setProperty('--dy', Math.sin(a) * d + 'px');
    p.style.left = playerX + 'px';
    p.style.top  = (gY - playerY - PLAYER_H) + 'px';
    world.appendChild(p);
    setTimeout(() => p.remove(), 500);
  }
}

// ── CARD ──────────────────────────────────────────────────
function openCard(p) {
  const d = p.el.dataset;
  document.getElementById('info-card-year').textContent  = d.year;
  document.getElementById('info-card-title').textContent = d.es;
  document.getElementById('info-card-text').textContent  = d.body || '';
  // imagen opcional
  const imgEl = document.getElementById('info-card-img-el');
  if (d.img) { imgEl.src = d.img; imgEl.style.display = 'block'; }
  else        { imgEl.style.display = 'none'; }
  document.getElementById('info-card').classList.add('visible');
  // resaltar año
  document.querySelectorAll('.bld-year').forEach(y => y.classList.remove('active'));
  p.el.querySelector('.bld-year').classList.add('active');
  activeCard = p;
}

function closeCard() {
  document.getElementById('info-card').classList.remove('visible');
  document.querySelectorAll('.bld-year').forEach(y => y.classList.remove('active'));
  activeCard = null;
  lastActive = null;
}

// ── PROXIMITY ─────────────────────────────────────────────
let lastActive = null;

function checkProximity() {
  let closest = null, closestDist = Infinity;
  PLATFORMS.forEach(p => {
    const center = p.left + p.w / 2;
    const dist = Math.abs(playerX - center);
    if (dist < PROX && dist < closestDist) { closestDist = dist; closest = p; }
  });

  if (closest && closest !== lastActive) {
    lastActive = closest;
    openCard(closest);
  } else if (!closest && lastActive) {
    closeCard();
  }
}

// ── INPUT ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && !e.repeat) { e.preventDefault(); tryJump(); }
  if (e.key === 'Escape') closeCard();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jumpConsumed = false;
});

const btnL = document.getElementById('btn-left');
const btnR = document.getElementById('btn-right');
const btnJ = document.getElementById('btn-jump');
btnL.addEventListener('mousedown',  () => keys.left  = true);
btnL.addEventListener('mouseup',    () => keys.left  = false);
btnL.addEventListener('mouseleave', () => keys.left  = false);
btnR.addEventListener('mousedown',  () => keys.right = true);
btnR.addEventListener('mouseup',    () => keys.right = false);
btnR.addEventListener('mouseleave', () => keys.right = false);
btnJ.addEventListener('mousedown',  e => { e.preventDefault(); tryJump(); });
btnL.addEventListener('touchstart', e => { e.preventDefault(); keys.left  = true; });
btnL.addEventListener('touchend',   () => keys.left  = false);
btnR.addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
btnR.addEventListener('touchend',   () => keys.right = false);
btnJ.addEventListener('touchstart', e => { e.preventDefault(); tryJump(); });

// ── POSE ──────────────────────────────────────────────────
const RUN_FRAMES = ['./images/run1.png', './images/run2.png', './images/run3.png', './images/run2.png'];
let runFrameIdx = 0, lastFrameTime = 0;
const FRAME_MS = 110;

function updatePose(vx, vy, g, now) {
  const img = document.getElementById('player-img');
  if (!img) return;
  if (!g) {
    img.src = './images/jump.png';
  } else if (Math.abs(vx) > 0.5) {
    if (now - lastFrameTime > FRAME_MS) {
      runFrameIdx = (runFrameIdx + 1) % RUN_FRAMES.length;
      img.src = RUN_FRAMES[runFrameIdx];
      lastFrameTime = now;
    }
  } else {
    img.src = './images/idle.png';
  }
  img.style.transform = vx < -0.3 ? 'scaleX(-1)' : 'scaleX(1)';
}

// ── GAME LOOP ─────────────────────────────────────────────
(function gameLoop() {
  const playerEl = document.getElementById('player');
  const world    = document.getElementById('world');

  function tick() {
    const now = performance.now();

    if (keys.right)     velX = Math.min(velX + ACCEL, MAX_SPD);
    else if (keys.left) velX = Math.max(velX - ACCEL, -MAX_SPD);
    else                velX *= FRICTION;
    if (Math.abs(velX) < 0.05) velX = 0;

    playerX = Math.max(20, Math.min(WORLD_W - 20, playerX + velX));
    velY += GRAVITY;
    playerY -= velY;

    const floor = getFloor(playerX);
    if (playerY <= floor) {
      const wasAir = !onGround;
      playerY = floor; velY = 0; onGround = true; jumpConsumed = false;
      if (wasAir) {
        playerEl.classList.remove('squish');
        void playerEl.offsetWidth;
        playerEl.classList.add('squish');
        setTimeout(() => playerEl.classList.remove('squish'), 200);
      }
    } else onGround = false;

    const sw = window.innerWidth;
    worldOffset = Math.max(0, Math.min(WORLD_W - sw, playerX - sw * 0.35));
    world.style.transform = `translateX(${-worldOffset}px)`;

    const gY = groundY();
    playerEl.style.left = (playerX - 45) + 'px';
    playerEl.style.top  = (gY - playerY - PLAYER_H) + 'px';

    updatePose(velX, velY, onGround, now);
    checkProximity();
    requestAnimationFrame(tick);
  }
  tick();
})();

layoutWorld();
window.addEventListener('resize', layoutWorld);
</script>
</body>
</html>

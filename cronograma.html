<style>

/* ── HEADER ── */
#site-header {
  border-bottom: 1.5px solid var(--ink);
}


/* ── LANG ── */
.lang-row {
  display: flex; gap: 0.4rem; align-items: center;
  font-size: 0.75rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.08em;
}
.lang-row span { opacity: 0.5; }
.lang-row button {
  background: none; border: 1.5px solid var(--ink); color: var(--ink);
  font-weight: 700; font-size: 0.75rem; letter-spacing: 0.08em;
  padding: 2px 9px; cursor: pointer; text-transform: uppercase; font-family: inherit;
  line-height: 1.4;
}
.lang-row button:hover,
.lang-row button.active { background: var(--ink); color: var(--bg); }

/* ── INFO BOX — protagonista ── */
#info-box {
  position: fixed;
  top: 50px;
  left: 0; right: 0;
  border-bottom: 1.5px solid var(--ink);
  background: var(--bg);
  padding: 1.4rem 2rem 1.2rem;
  z-index: 40;
  min-height: 110px;
  display: grid;
  grid-template-columns: 90px 1fr;
  grid-template-rows: auto auto;
  column-gap: 1.8rem;
  row-gap: 0.3rem;
  align-items: start;
  transition: opacity 0.3s;
}
#info-box.empty { opacity: 0.2; }

#info-year {
  font-size: 2.2rem;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1;
  grid-row: 1 / 3;
  grid-column: 1;
  align-self: center;
  font-family: 'Bebas Neue', sans-serif;
  color: var(--ink);
}
#info-title {
  font-size: 1rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  line-height: 1.2;
  grid-row: 1;
  grid-column: 2;
  align-self: end;
}
#info-body {
  font-size: 0.85rem;
  line-height: 1.65;
  opacity: 0.75;
  grid-row: 2;
  grid-column: 2;
}

/* placeholder cuando no hay nada */
#info-placeholder {
  position: fixed;
  top: 47px; left: 0; right: 0;
  padding: 1.4rem 2rem 1.2rem;
  min-height: 110px;
  z-index: 39;
  display: flex;
  align-items: center;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  opacity: 0.35;
  pointer-events: none;
}

/* ── MUNDO ── */
#world-wrapper {
  position: fixed;
  top: 47px; bottom: 37px; left: 0; right: 0;
  overflow: hidden;
}
#world {
  position: absolute; width: 6000px; height: 100%;
  top: 0; left: 0;
}

/* offset dinámico — se ajusta por JS según altura del info-box */
#world-inner {
  position: absolute;
  inset: 0;
}

.block {
  position: absolute;
  border: 1.5px solid var(--ink);
  border-bottom: none;
  background: var(--bg);
}

.bld-text { display: none; }

/* ── JUGADOR ── */
#player {
  position: absolute;
  width: 22px; height: 32px;
}
@keyframes squish {
  0%   { transform: scaleX(1.5) scaleY(0.6); }
  55%  { transform: scaleX(0.9) scaleY(1.1); }
  100% { transform: scaleX(1)   scaleY(1);   }
}
#player.squish { animation: squish 0.2s ease-out forwards; }

.particle {
  position: absolute; width: 3px; height: 3px;
  background: var(--ink); pointer-events: none;
  animation: pf 0.45s ease-out forwards;
}
@keyframes pf { to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }

/* ── FOOTER ── */
#site-footer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  border-top: 1.5px solid var(--ink); padding: 0.5rem 2rem;
  background: var(--bg);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700;
}
#site-footer .controls { display: flex; gap: 0.5rem; }
#site-footer button {
  background: none; border: 1.5px solid var(--ink); color: var(--ink);
  font-family: inherit; font-weight: 900; font-size: 0.85rem;
  padding: 3px 10px; cursor: pointer;
}
#site-footer button:hover,
#site-footer button:active { background: var(--ink); color: var(--bg); }
</style>

        <circle cx="11" cy="5" r="3.5" stroke="var(--ink)" stroke-width="1.5" fill="var(--bg)"/>
        <line x1="11" y1="8.5" x2="11" y2="20" stroke="var(--ink)" stroke-width="1.5"/>
        <line id="p-arm-l" x1="11" y1="12" x2="4"  y2="17" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
        <line id="p-arm-r" x1="11" y1="12" x2="18" y2="14" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
        <line id="p-leg-l" x1="11" y1="20" x2="5"  y2="30" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
        <line id="p-leg-r" x1="11" y1="20" x2="17" y2="30" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div id="site-footer">
  <div class="controls">
    <button id="btn-left">←</button>
    <button id="btn-jump">↑</button>
    <button id="btn-right">→</button>
  </div>
  <span id="footer-hint">← → moverse · ↑ saltar</span>
</div>

<script>
let lang = 'es';

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll('.lang-row button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (lastActive) renderInfo(lastActive);
}

// ── LAYOUT ────────────────────────────────────────────────
let PLATFORMS = [];

function infoBoxHeight() {
  return document.getElementById('info-box').offsetHeight;
}

function headerHeight() {
  return document.getElementById('site-header').offsetHeight;
}

function groundY() {
  const wrapperH = document.getElementById('world-wrapper').clientHeight;
  return wrapperH - 60;
}

function worldTop() {
  // cuánto espacio ocupa el info-box dentro del world-wrapper
  return infoBoxHeight();
}

function layoutWorld() {
  const gY = groundY();
  document.getElementById('ground-line').style.top = gY + 'px';

  PLATFORMS = [];
  document.querySelectorAll('.bld').forEach(bld => {
    const left = parseInt(bld.dataset.left);
    const w    = parseInt(bld.dataset.w);
    const h    = parseInt(bld.dataset.h);
    const wb   = parseInt(bld.dataset.wb || 0);

    const block = bld.querySelector('.block');
    block.style.left   = left + 'px';
    block.style.top    = (gY - wb - h) + 'px';
    block.style.width  = w + 'px';
    block.style.height = h + 'px';

    PLATFORMS.push({ left, w, h, wb, el: bld });
  });
}

// ── GAME STATE ────────────────────────────────────────────
let playerX = 80, playerY = 0, velX = 0, velY = 0;
let onGround = true, worldOffset = 0;
let stepPhase = 0, jumpConsumed = false;
const WORLD_W = 6000, GRAVITY = 0.55, JUMP_F = -13;
const ACCEL = 0.55, FRICTION = 0.80, MAX_SPD = 7, PLAYER_H = 32;
const PROX = 160;
const keys = { left: false, right: false };

function getFloor(x) {
  let h = 0;
  PLATFORMS.forEach(p => {
    if (x + 10 > p.left && x - 10 < p.left + p.w)
      h = Math.max(h, p.wb + p.h);
  });
  return h;
}

function tryJump() {
  if (onGround && !jumpConsumed) {
    velY = JUMP_F; onGround = false; jumpConsumed = true; spawnParticles();
  }
}

function spawnParticles() {
  const world = document.getElementById('world');
  const gY = groundY();
  for (let i = 0; i < 5; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const a = Math.PI + Math.random() * Math.PI, d = 15 + Math.random() * 25;
    p.style.setProperty('--dx', Math.cos(a) * d + 'px');
    p.style.setProperty('--dy', Math.sin(a) * d + 'px');
    p.style.left = playerX + 'px';
    p.style.top  = (gY - playerY - PLAYER_H) + 'px';
    world.appendChild(p);
    setTimeout(() => p.remove(), 500);
  }
}

// ── INFO ──────────────────────────────────────────────────
let lastActive = null;

function renderInfo(p) {
  const bt = p.el.querySelector('.bld-text');
  const yearEl  = bt.querySelector('.bt-year');
  const titleEl = bt.querySelector('.bt-title');
  const bodyEl  = bt.querySelector('.bt-body');
  document.getElementById('info-year').textContent  = yearEl  ? yearEl.textContent : '';
  document.getElementById('info-title').textContent = titleEl ? (titleEl.dataset[lang] || titleEl.dataset.es || titleEl.textContent) : '';
  document.getElementById('info-body').textContent  = bodyEl  ? (bodyEl.dataset[lang]  || bodyEl.dataset.es  || bodyEl.textContent)  : '';
  document.getElementById('info-box').classList.remove('empty');
  document.getElementById('info-placeholder').style.display = 'none';
}

function checkProximity() {
  let closest = null, closestDist = Infinity;
  PLATFORMS.forEach(p => {
    const center = p.left + p.w / 2;
    const dist = Math.abs(playerX - center);
    if (dist < PROX && dist < closestDist) { closestDist = dist; closest = p; }
  });

  if (closest && closest !== lastActive) {
    lastActive = closest;
    renderInfo(closest);
  } else if (!closest && lastActive) {
    lastActive = null;
    document.getElementById('info-year').textContent  = '';
    document.getElementById('info-title').textContent = '';
    document.getElementById('info-body').textContent  = '';
    document.getElementById('info-box').classList.add('empty');
    document.getElementById('info-placeholder').style.display = 'flex';
  }
}

// ── INPUT ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') && !e.repeat) { e.preventDefault(); tryJump(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft'  || e.key === 'a') keys.left  = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') jumpConsumed = false;
});

const btnL = document.getElementById('btn-left');
const btnR = document.getElementById('btn-right');
const btnJ = document.getElementById('btn-jump');
btnL.addEventListener('mousedown',  () => keys.left  = true);
btnL.addEventListener('mouseup',    () => keys.left  = false);
btnL.addEventListener('mouseleave', () => keys.left  = false);
btnR.addEventListener('mousedown',  () => keys.right = true);
btnR.addEventListener('mouseup',    () => keys.right = false);
btnR.addEventListener('mouseleave', () => keys.right = false);
btnJ.addEventListener('mousedown',  e => { e.preventDefault(); tryJump(); });
btnL.addEventListener('touchstart', e => { e.preventDefault(); keys.left  = true; });
btnL.addEventListener('touchend',   () => keys.left  = false);
btnR.addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
btnR.addEventListener('touchend',   () => keys.right = false);
btnJ.addEventListener('touchstart', e => { e.preventDefault(); tryJump(); });

// ── POSE ──────────────────────────────────────────────────
function updatePose(vx, vy, g) {
  const svg = document.getElementById('player-svg');
  if (!svg) return;
  const aL = document.getElementById('p-arm-l'), aR = document.getElementById('p-arm-r');
  const lL = document.getElementById('p-leg-l'), lR = document.getElementById('p-leg-r');
  if (!g && vy < -2) {
    aL.setAttribute('x2','3');  aL.setAttribute('y2','10'); aR.setAttribute('x2','19'); aR.setAttribute('y2','10');
    lL.setAttribute('x2','7');  lL.setAttribute('y2','25'); lR.setAttribute('x2','15'); lR.setAttribute('y2','25');
  } else if (!g && vy > 2) {
    aL.setAttribute('x2','2');  aL.setAttribute('y2','16'); aR.setAttribute('x2','20'); aR.setAttribute('y2','16');
    lL.setAttribute('x2','3');  lL.setAttribute('y2','30'); lR.setAttribute('x2','19'); lR.setAttribute('y2','30');
  } else if (g && Math.abs(vx) > 0.8) {
    stepPhase += Math.abs(vx) * 0.15;
    const s = Math.sin(stepPhase);
    lL.setAttribute('x2', 11 + s * 8); lL.setAttribute('y2', 22 + Math.abs(s) * 6);
    lR.setAttribute('x2', 11 - s * 8); lR.setAttribute('y2', 22 + Math.abs(s) * 6);
    aL.setAttribute('x2', 11 - s * 5); aL.setAttribute('y2','15');
    aR.setAttribute('x2', 11 + s * 5); aR.setAttribute('y2','15');
  } else {
    aL.setAttribute('x2','4');  aL.setAttribute('y2','17'); aR.setAttribute('x2','18'); aR.setAttribute('y2','14');
    lL.setAttribute('x2','5');  lL.setAttribute('y2','30'); lR.setAttribute('x2','17'); lR.setAttribute('y2','30');
  }
  if (vx > 0.3)       svg.style.transform = 'scaleX(1)';
  else if (vx < -0.3) svg.style.transform = 'scaleX(-1)';
}

// ── GAME LOOP ─────────────────────────────────────────────
function gameLoop() {
  const playerEl = document.getElementById('player');
  const world    = document.getElementById('world');

  function tick() {
    if (keys.right)      velX = Math.min(velX + ACCEL, MAX_SPD);
    else if (keys.left)  velX = Math.max(velX - ACCEL, -MAX_SPD);
    else                 velX *= FRICTION;
    if (Math.abs(velX) < 0.05) velX = 0;

    playerX = Math.max(20, Math.min(WORLD_W - 20, playerX + velX));
    velY += GRAVITY;
    playerY -= velY;

    const floor = getFloor(playerX);
    if (playerY <= floor) {
      const wasAir = !onGround;
      playerY = floor; velY = 0; onGround = true; jumpConsumed = false;
      if (wasAir) {
        playerEl.classList.remove('squish');
        void playerEl.offsetWidth;
        playerEl.classList.add('squish');
        setTimeout(() => playerEl.classList.remove('squish'), 200);
      }
    } else onGround = false;

    const sw = window.innerWidth;
    worldOffset = Math.max(0, Math.min(WORLD_W - sw, playerX - sw * 0.35));
    world.style.transform = `translateX(${-worldOffset}px)`;

    const gY = groundY();
    playerEl.style.left = playerX + 'px';
    playerEl.style.top  = (gY - playerY - PLAYER_H) + 'px';

    updatePose(velX, velY, onGround);
    checkProximity();
    requestAnimationFrame(tick);
  }
  tick();
}

// ── INIT ──────────────────────────────────────────────────
layoutWorld();
window.addEventListener('resize', layoutWorld);
gameLoop();
</script>
</body>
</html>
